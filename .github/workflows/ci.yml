name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lint (ruff)
        run: make lint
      - name: Unit and API tests, typecheck
        run: make test
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build and run the end-to-end smoke test
        run: make e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build image
        run: docker compose build
      - name: Seed, start the container and wait for it to answer
        env:
          SOLODESK_PASSWORD: ci-only-password
          TZ: Pacific/Kiritimati # UTC+14 all year, so a missing time zone database shows
        run: |
          docker compose run --rm solodesk python -m solodesk.seed
          docker compose up -d
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4150/api/health && exit 0
            sleep 1
          done
          exit 1
      - name: Sign in, fetch an invoice PDF and check the time zone
        run: |
          curl -fsS http://127.0.0.1:4150/ | grep -q '<div id="root">'
          curl -fsS -c cookies.txt -H 'Content-Type: application/json' \
            -d '{"password": "ci-only-password"}' http://127.0.0.1:4150/api/auth/login
          curl -fsS -b cookies.txt -o invoice.pdf http://127.0.0.1:4150/api/invoices/1/pdf
          head -c 5 invoice.pdf | grep -q '%PDF-'
          docker compose exec -T solodesk python -c \
            "import time; offset = time.strftime('%z'); assert offset == '+1400', offset"
      - name: Back up the database the way the README says
        run: |
          docker compose stop
          docker compose cp solodesk:/data/solodesk.db ./solodesk-backup.db
          docker compose start
          test "$(head -c 15 solodesk-backup.db)" = "SQLite format 3"
      - name: Container logs
        if: failure()
        run: docker compose logs
